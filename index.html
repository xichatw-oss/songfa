<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24533F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>崧發茶園</title>
<style>
:root{
  --leaf:#24533F; --leaf-d:#173A2B; --leaf-l:#E4EFE8; --leaf-m:#9BC2AC;
  --paper:#F6F3EC; --paper-2:#ECE6DA; --card:#FFFFFF; --line:#DDD5C6;
  --ink:#27231B; --ink-2:#6F665A; --ink-3:#A89F90;
  --gold:#8A6516; --gold-l:#F8EFD9; --red:#9B2C22; --red-l:#FBE9E6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}

/* 頂部 */
.top{position:sticky;top:0;z-index:20;background:var(--leaf);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;font-weight:700;letter-spacing:.5px;flex:1}
.top .sync{font-size:11px;color:var(--leaf-m);margin-right:2px}
.icon-b{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.icon-b svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-b.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 底部導覽 */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:520px;margin:0 auto;display:flex}
.nav button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--leaf);font-weight:600}

.page{display:none;padding:14px 14px 20px}
.page.on{display:block}
.sec-t{font-size:13px;font-weight:600;color:var(--ink-2);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec-t a{font-weight:400;color:var(--leaf);font-size:13px}

/* 總覽 */
.hero{background:var(--leaf-d);color:#fff;border-radius:18px;padding:18px 18px 16px}
.hero .lbl{font-size:12px;color:var(--leaf-m)}
.hero .big{font-size:34px;font-weight:700;line-height:1.15;margin:2px 0 10px}
.hero-row{display:flex;gap:18px;border-top:1px solid rgba(255,255,255,.14);padding-top:10px}
.hero-row div{flex:1}
.hero-row b{display:block;font-size:17px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:15px;border-radius:14px;background:var(--gold);color:#fff;font-size:16px;font-weight:700}
.cta svg{width:20px;height:20px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.bars{background:var(--card);border-radius:14px;padding:14px 12px 10px;display:flex;align-items:flex-end;gap:8px;height:150px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar .stack{width:100%;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.bar .rv{background:var(--leaf-l);border-radius:6px 6px 0 0;position:relative}
.bar .pf{background:var(--leaf);border-radius:0 0 3px 3px}
.bar span{font-size:10px;color:var(--ink-3)}
.bar em{font-style:normal;font-size:10px;color:var(--ink-2)}
.legend{font-size:11px;color:var(--ink-3);margin:6px 2px 0;display:flex;gap:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* 列表卡片 */
.list{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--paper-2);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .m{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex-shrink:0}
.row .r b{display:block;font-size:15px}
.row .r small{font-size:12px;color:var(--leaf)}
.row .r small.neg{color:var(--red)}
.month-h{font-size:12px;color:var(--ink-3);margin:16px 4px 6px;display:flex;justify-content:space-between}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;vertical-align:1px;margin-left:4px;font-weight:500}
.tag.w{background:var(--gold-l);color:var(--gold)}
.tag.x{background:var(--red-l);color:var(--red)}
.tag.b{background:var(--leaf-l);color:var(--leaf)}

.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink-2)}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.empty{padding:32px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.err{background:var(--red-l);color:var(--red);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:10px}
.btn-add{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;border-radius:12px;background:var(--leaf);color:#fff;font-weight:600;font-size:14px;white-space:nowrap}

/* 統計 */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border-radius:14px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--ink-2)}
.kpi b{display:block;font-size:20px;margin-top:2px}
.rank{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--paper-2)}
.rank:last-child{border-bottom:0}
.rank .n{width:20px;font-size:12px;color:var(--ink-3);text-align:right}
.rank .nm{flex:1;min-width:0}
.rank .nm div{font-size:14px;font-weight:500}
.rank .nm small{font-size:11px;color:var(--ink-3)}
.rank .track{height:5px;background:var(--paper-2);border-radius:3px;margin-top:4px;overflow:hidden}
.rank .track i{display:block;height:100%;background:var(--leaf-m);border-radius:3px}
.rank .v{text-align:right;font-size:14px;font-weight:600}
.tbl-w{overflow-x:auto;background:var(--card);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--paper-2)}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--ink-2);font-size:12px;background:var(--paper-2)}

/* 底部抽屜 */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(30,26,18,.45);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.icon-b.spin svg{animation:none}}
.sheet-h{display:flex;align-items:center;padding:14px 16px 10px;gap:8px}
.sheet-h h2{flex:1;font-size:17px}
.sheet-h button{font-size:14px;color:var(--ink-2);padding:4px 8px}
.sheet-b{overflow-y:auto;padding:4px 16px 16px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}

.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px;min-height:44px}
.in:focus{outline:2px solid var(--leaf-m);outline-offset:0;border-color:var(--leaf)}
.in[readonly]{background:var(--paper-2);color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--paper-2);border-radius:10px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:8px;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.oline{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.oline-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.oline-h .no{font-size:12px;color:var(--ink-3);width:18px}
.oline-h .in{flex:1}
.bag-t{padding:0 10px;height:44px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--ink-3);white-space:nowrap}
.bag-t.on{background:var(--leaf-l);border-color:var(--leaf-m);color:var(--leaf);font-weight:600}
.oline .grid3 label{font-size:11px}
.oline-f{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.oline-f .sp{flex:1}
.oline-f b{color:var(--ink)}
.link{color:var(--leaf);font-size:13px;padding:4px 6px}
.link.red{color:var(--red)}
.detail{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.detail.open{display:block}
.add-line{width:100%;padding:12px;border:1.5px dashed var(--leaf-m);border-radius:14px;color:var(--leaf);font-weight:600;margin-bottom:14px}
.box{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
.box-t{font-size:13px;font-weight:600;margin-bottom:8px}
.qrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qrow>span{width:48px;font-size:13px;color:var(--ink-2);flex-shrink:0}
.qrow .in{width:84px;flex-shrink:0;text-align:right;padding:8px 10px;min-height:38px}
.qrow .chips{margin:0;flex:1}
.qrow .chip{padding:5px 11px}
.sum{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sum div{flex:1}
.sum span{font-size:12px;color:var(--ink-2)}
.sum b{display:block;font-size:20px}
.sum b.pos{color:var(--leaf)} .sum b.neg{color:var(--red)}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--leaf);color:#fff;font-size:16px;font-weight:700}
.btn:disabled{opacity:.55}
.btn.gold{background:var(--gold)}
.btn.ghost{background:var(--card);color:var(--leaf);border:1px solid var(--leaf-m);margin-top:8px}
.btn.danger{background:var(--card);color:var(--red);border:1px solid #E3B6AF;margin-top:8px}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px solid var(--paper-2)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-2)}
.hint{font-size:12px;color:var(--ink-3);margin:-4px 0 10px;line-height:1.5}

/* 登入 */
.login{position:fixed;inset:0;z-index:100;background:var(--leaf-d);display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;color:#fff}
.login.open{display:flex}
.login h1{font-size:26px;margin-bottom:4px}
.login p{color:var(--leaf-m);font-size:13px;margin-bottom:26px}
.login .in{max-width:300px;text-align:center;font-size:18px;letter-spacing:4px}
.login .btn{max-width:300px;margin-top:10px;background:var(--gold)}
.login .e{color:#F4B9B0;font-size:13px;margin-top:10px;min-height:20px;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:40px;text-align:center;color:var(--ink-3)}
</style>
</head>
<body>

<div class="login" id="login">
  <h1>崧發茶園</h1>
  <p>請輸入管理密碼</p>
  <input class="in" id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn" id="loginBtn" onclick="doLogin()">登入</button>
  <div class="e" id="loginErr"></div>
</div>

<div class="app">
  <header class="top">
    <h1 id="pageTitle">總覽</h1>
    <span class="sync" id="syncTxt" onclick="if(LAST_ERR)alert('上次更新失敗原因：\n' + LAST_ERR)"></span>
    <button class="icon-b" id="syncBtn" onclick="refreshAll(true)" aria-label="同步">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="icon-b" onclick="openSettings()" aria-label="設定">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <main>
    <section class="page on" id="p-dash"></section>
    <section class="page" id="p-orders">
      <div class="search">
        <input id="oq" type="search" placeholder="搜尋客戶、品項、備註" oninput="renderOrders()">
        <button class="btn-add" onclick="openOrderForm()">＋ 訂單</button>
      </div>
      <div class="chips" id="oFilter"></div>
      <div id="oList"></div>
    </section>
    <section class="page" id="p-cust">
      <div class="search">
        <input id="cq" type="search" placeholder="搜尋姓名、電話" oninput="renderCustomers()">
        <button class="btn-add" onclick="openCustomerForm()">＋ 客戶</button>
      </div>
      <div class="chips" id="cSort"></div>
      <div id="cList"></div>
    </section>
    <section class="page" id="p-stats"></section>
    <section class="page" id="p-buy">
      <div class="search">
        <input id="bq" type="search" placeholder="搜尋供應商、品項" oninput="renderPurchases()">
        <button class="btn-add" onclick="openPurchaseForm()">＋ 進貨</button>
      </div>
      <div id="bList"></div>
    </section>
  </main>
</div>

<nav class="nav"><div class="nav-in">
  <button class="on" data-p="dash" onclick="go('dash')"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>總覽</button>
  <button data-p="orders" onclick="go('orders')"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>訂單</button>
  <button data-p="cust" onclick="go('cust')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>客戶</button>
  <button data-p="stats" onclick="go('stats')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>統計</button>
  <button data-p="buy" onclick="go('buy')"><svg viewBox="0 0 24 24"><path d="M12 3c4 3 6 6 6 10a6 6 0 0 1-12 0c0-4 2-7 6-10z"/><path d="M12 9v12"/></svg>茶乾</button>
</div></nav>

<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 基本設定 ================= */
const API = 'https://script.google.com/macros/s/AKfycby-TfeD9buzWty4xzzO3r1bJp_0MiuYSPxIUXPv5xW-H5GzniLAFuNd1uPvJsZz5b9c0A/exec';
const SH = { orders:'訂單紀錄', cust:'客戶資料', buy:'茶乾購買', annual:'年度報表' };
const STATUSES = ['已出貨','未出貨','取消'];
const CACHE_KEY = 'songfa_v2_cache';
const SET_KEY = 'songfa_v2_settings';
const DEFAULT_SET = { leaf:50, roast:50, deox:16, boxChips:'0,30', shipChips:'0,110,150,210', feeChips:'0,60,90,120' };

let PW = null;
let DB = { orders:[], customers:[], purchases:[], annual:[] };
let SET = loadSettings();
let curPage = 'dash';
let oFilter = 'all';
let cSort = 'recent';
let statYear = null;

/* ================= 小工具 ================= */
const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isNaN(n) ? 0 : n; };
const money = v => '$' + Math.round(num(v)).toLocaleString();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
// 品項合併：不分大小寫、忽略空白、不管字的順序（金萱輕焙＝輕焙金萱）
const itemKey = s => [...String(s || '').toLowerCase().replace(/\s+/g,'')].sort().join('');
const isBagName = s => String(s || '').includes('茶包');
const rid = () => Math.random().toString(36).slice(2,10).toUpperCase();
const chipList = s => String(s || '').split(/[,，\s]+/).filter(x => x !== '').map(Number).filter(n => !isNaN(n));

// 各種日期格式 → YYYY-MM-DD（Excel 序號、ISO、2026.1.20、2026/1/20）
function normDate(v) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number' || /^\d{5}(\.\d+)?$/.test(String(v))) {
    const d = new Date(Math.round((num(v) - 25569) * 86400000));
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
  }
  const s = String(v).trim();
  if (/T\d{2}:/.test(s)) { const d = new Date(s); if (!isNaN(d)) return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  const m = s.match(/^(\d{4})[.\/\-](\d{1,2})[.\/\-](\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  return s;
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

function loadSettings() {
  try { return { ...DEFAULT_SET, ...JSON.parse(localStorage.getItem(SET_KEY) || '{}') }; }
  catch(e) { return { ...DEFAULT_SET }; }
}

/* ================= API ================= */
async function sha256(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
const READ_ACTIONS = ['getAll'];   // bootstrap 失敗會直接改走分開讀取，不重試
const sleep = ms => new Promise(r => setTimeout(r, ms));
// 讀取失敗會自動重試 2 次；寫入不重試（避免重複新增）
async function api(params, hash) {
  const tries = READ_ACTIONS.includes(params.action) ? 3 : 1;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    if (i) await sleep(1500 * i);
    try { return await apiOnce(params, hash); }
    catch(e) { lastErr = e; if (!e.retry) throw e; }
  }
  throw lastErr;
}
async function apiOnce(params, hash) {
  const p = { ...params, pwHash: hash || PW };
  const qs = Object.entries(p).map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
  let text, status = 0;
  const isRead = READ_ACTIONS.includes(params.action) || params.action === 'bootstrap' || params.action === 'ping';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), isRead ? 25000 : 45000);
  try { const res = await fetch(API + '?' + qs, { redirect:'follow', signal: ctrl.signal }); status = res.status; text = await res.text(); }
  catch(e) {
    const timeout = e.name === 'AbortError';
    const er = new Error(timeout
      ? (isRead ? 'Google 超過 25 秒沒有回應' : 'Google 超過 45 秒沒有回應，資料可能已經寫入，請先按同步確認，不要重複儲存')
      : '連不上 Google（網路中斷或切換了 App）');
    er.retry = isRead; throw er;
  } finally { clearTimeout(timer); }
  let d;
  try { d = JSON.parse(text); }
  catch(e) {
    const t = text.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    const noOpen = /unable to open|無法開啟/i.test(t);
    const perm = !noOpen && /sign in|登入|授權|authoriz|permission|權限/i.test(t);
    const er = new Error(perm ? 'Apps Script 權限跑掉了，請到「管理部署作業」檢查存取設定'
                       : noOpen ? 'Google 沒有把結果送回來（無法開啟這個檔案）'
                       : `Google 暫時出錯（${status || '無狀態碼'}）：${t.slice(0, 60) || '空白回應'}`);
    er.retry = !perm; er.status = status; er.raw = t.slice(0, 160); throw er;
  }
  if (d && d.error) {
    if (d.code === 401 && !hash) { requireLogin(); }
    const er = new Error(d.code === 401 ? '密碼錯誤或已失效' : d.error);
    er.retry = /timeout|逾時|busy|Service|暫時/i.test(d.error);
    throw er;
  }
  return d;
}

function shiftAfterDelete(list, rowIndex) {
  const out = list.filter(r => r._rowIndex !== rowIndex);
  out.forEach(r => { if (r._rowIndex > rowIndex) r._rowIndex--; });
  return out;
}
function nextRowIndex(list, res) {
  const n = res && parseInt(res.rowIndex, 10);
  return n > 1 ? n : Math.max(1, ...list.map(r => r._rowIndex || 0)) + 1;
}

let refreshing = false;
async function refreshAll(manual, opt = {}) {
  if (!PW || refreshing) return;
  refreshing = true; setSync('busy');
  try {
    let o, b, c;
    if (HAS_BOOT !== false) {
      try {
        const d = await api({ action:'bootstrap' });
        o = d.orders; b = d.purchases; c = d.customers; HAS_BOOT = true;
      } catch(e) {
        if (/密碼錯誤/.test(e.message)) throw e;
        HAS_BOOT = false;   // 一次讀三張失敗，這次改成分開讀（每次回傳的資料較小）
      }
    }
    if (!o) {
      const jobs = [getAll(SH.orders), getAll(SH.buy)];
      if (!opt.skipCust) jobs.push(getAll(SH.cust));
      [o, b, c] = await Promise.all(jobs);
    }
    setOrders(o || []); setPurchases(b || []); if (c) setCustomers(c);
    LAST_ERR = '';
    DB.annual = []; // 年度報表下次打開統計頁時重抓

  } catch(e) {
    LAST_ERR = e.message;
    setSync('err');
    if (PW) toast('更新失敗：' + e.message);
  }
  refreshing = false;
  LAST_TRY = Date.now();
}

// 單列淨利（依照 Excel 的算法：茶包不扣茶葉消耗/烘焙/脫氧）
function lineProfit(r) {
  const bag = isBagName(r['品項']);
  const extra = bag ? 0 : num(r['茶葉消耗']) + num(r['烘焙']) + num(r['脫氧+鋁袋']);
  return num(r['總金額']) - num(r['茶葉*斤數成本']) - extra - num(r['箱子']) - num(r['運費']) - num(r['手續費']);
}
// 同一天同一位客戶 = 一張出貨單
function shipments(rows) {
  const map = new Map();
  rows.forEach(r => {
    const k = r['日期'] + '|' + (r['客戶資料'] || '');
    if (!map.has(k)) map.set(k, { key:k, date:r['日期'], cust:r['客戶資料'] || '', rows:[] });
    map.get(k).rows.push(r);
  });
  const list = [...map.values()];
  list.forEach(s => {
    s.rows.sort((a,b) => a._rowIndex - b._rowIndex);
    s.total = s.rows.reduce((a,r) => a + num(r['總金額']), 0);
    s.profit = s.rows.reduce((a,r) => a + num(r['淨利']), 0);
    s.jin = s.rows.reduce((a,r) => a + (isBagName(r['品項']) ? 0 : num(r['斤數'])), 0);
    const st = s.rows.map(r => r['訂單狀態'] || '已出貨');
    s.status = st.includes('未出貨') ? '未出貨' : st.every(x => x === '取消') ? '取消' : '已出貨';
    s.maxRow = Math.max(...s.rows.map(r => r._rowIndex || 0));
  });
  return list.sort((a,b) => b.date.localeCompare(a.date) || b.maxRow - a.maxRow);
}

        <div class="fld"><label>價位（元/斤）</label><input class="in num" type="number" inputmode="decimal" value="${L.price}" oninput="updLine(${i},'price',this.value)"></div>
        <div class="fld"><label id="ln_qlbl_${i}">${L.bag ? '數量' : '斤數'}</label><input class="in num" type="number" inputmode="decimal" step="0.125" value="${L.qty}" oninput="updLine(${i},'qty',this.value)"></div>
        <div class="fld"><label>單斤成本</label><input class="in num" type="number" inputmode="decimal" value="${L.cost}" oninput="updLine(${i},'cost',this.value)"></div>
      </div>
      <div class="oline-f"><span>小計 <b class="num" id="ln_sub_${i}">$0</b></span><span class="sp"></span>
        <button class="link" onclick="toggleDetail(${i})">成本細項</button>
        ${DRAFT.lines.length > 1 ? `<button class="link red" onclick="DRAFT.lines.splice(${i},1);renderLines()">移除</button>` : ''}</div>
      <div class="detail ${L.open ? 'open' : ''}" id="ln_det_${i}">
        <div class="grid3">
          <div class="fld"><label>茶葉消耗</label><input class="in num" type="number" inputmode="decimal" id="ln_leaf_${i}" value="${L.leaf}" oninput="updLine(${i},'leaf',this.value,true)"></div>
          <div class="fld"><label>烘焙</label><input class="in num" type="number" inputmode="decimal" id="ln_roast_${i}" value="${L.roast}" oninput="updLine(${i},'roast',this.value,true)"></div>
          <div class="fld"><label>脫氧+鋁袋</label><input class="in num" type="number" inputmode="decimal" id="ln_deox_${i}" value="${L.deox}" oninput="updLine(${i},'deox',this.value,true)"></div>
        </div>
        <div class="fld"><label>產品編號（選填）</label><input class="in" value="${esc(L.pid)}" oninput="DRAFT.lines[${i}].pid=this.value" placeholder="例：民二水gaba"></div>
        <div class="hint">依斤數自動計算（每斤 ${SET.leaf}／${SET.roast}／${SET.deox}），可手動改。茶包不計。</div>
      </div>
    </div>`).join('');
  ['box','ship','fee'].forEach(markChips);
  calcDraft();
  if (focusLast) $('ln_item_' + (DRAFT.lines.length - 1))?.focus();
}
function toggleDetail(i) { const L = DRAFT.lines[i]; L.open = !L.open; $('ln_det_' + i).classList.toggle('open', L.open); }
function toggleBag(i) {
  const L = DRAFT.lines[i]; L.bag = !L.bag; L.bagManual = true;
  $('ln_bag_' + i).classList.toggle('on', L.bag); $('ln_qlbl_' + i).textContent = L.bag ? '數量' : '斤數';
  calcDraft();
}
function updLine(i, f, v, manual) {
  const L = DRAFT.lines[i]; L[f] = v;
  if (manual) L.man[f] = v !== '';
  if (f === 'item' && !L.bagManual) {
    L.bag = isBagName(v);
    $('ln_bag_' + i).classList.toggle('on', L.bag); $('ln_qlbl_' + i).textContent = L.bag ? '數量' : '斤數';
  }
  calcDraft();
}
// 自動細項：非手動欄位依斤數 × 每斤費用
function autoLine(L, i) {
  const q = num(L.qty);
  [['leaf', SET.leaf], ['roast', SET.roast], ['deox', SET.deox]].forEach(([f, rate]) => {
    if (L.man[f]) return;
    L[f] = L.bag || !q ? (q ? 0 : '') : +(q * num(rate)).toFixed(2);
    const el = $('ln_' + f + '_' + i); if (el && document.activeElement !== el) el.value = L[f];
  });
}
function lineCalc(L, first) {
  const total = num(L.price) * num(L.qty);
  const leafCost = num(L.qty) * num(L.cost);
  const extra = L.bag ? 0 : num(L.leaf) + num(L.roast) + num(L.deox);
  const fees = first ? num(DRAFT.box) + num(DRAFT.ship) + num(DRAFT.fee) : 0;
  return { total, leafCost, profit: total - leafCost - extra - fees };
}
function calcDraft() {
  let t = 0, p = 0;
  DRAFT.lines.forEach((L, i) => {
    autoLine(L, i);
    const c = lineCalc(L, i === 0);
    t += c.total; p += c.profit;
    const el = $('ln_sub_' + i); if (el) el.textContent = money(c.total);
  });
  $('ofTotal').textContent = money(t);
  const pe = $('ofProfit'); pe.textContent = money(p); pe.className = 'num ' + (p < 0 ? 'neg' : 'pos');
}

async function saveOrder() {
  const cust = DRAFT.cust.trim();
  const lines = DRAFT.lines.filter(L => L.item.trim() || num(L.qty));
  if (!cust) { toast('請填客戶'); $('of_cust').focus(); return; }
  if (!lines.length) { toast('至少要有一個品項'); return; }
  const bad = lines.findIndex(L => !L.item.trim() || !num(L.qty));
  if (bad >= 0) { toast(`第 ${bad+1} 個品項缺品項名稱或斤數`); return; }
  const btn = $('ofSave'); btn.disabled = true;
  const id = rid();
  let done = 0;
  try {
    for (let i = 0; i < lines.length; i++) {
      const L = lines[i], first = i === 0, c = lineCalc(L, first);
      btn.textContent = lines.length > 1 ? `儲存中 ${i+1}/${lines.length}…` : '儲存中…';
      const row = {
        '訂單ID': id, '日期': DRAFT.date || today(), '客戶資料': cust, '品項': L.item.trim(),
        '價位': num(L.price), '斤數': num(L.qty), '總金額': Math.round(c.total), '產品編號': L.pid.trim(),
        '單斤成本': num(L.cost), '茶葉*斤數成本': Math.round(c.leafCost * 100) / 100,
        '茶葉消耗': L.bag ? 0 : num(L.leaf), '烘焙': L.bag ? 0 : num(L.roast), '脫氧+鋁袋': L.bag ? 0 : num(L.deox),
        '箱子': first ? num(DRAFT.box) : 0, '運費': first ? num(DRAFT.ship) : 0, '手續費': first ? num(DRAFT.fee) : 0,
        '淨利': Math.round(c.profit * 10) / 10, '備註': first ? DRAFT.note.trim() : '', '訂單狀態': DRAFT.status,
      };
      const res = await addRow(SH.orders, row);
      DB.orders.push({ ...row, _rowIndex: nextRowIndex(DB.orders, res) });
      done++;
    }
    // 新客戶自動建檔
    if (!DB.customers.some(x => x['客戶姓名'] === cust)) {
      try {
        const crow = { 'ID': rid(), '客戶姓名': cust, '建檔日期': today() };
        const res = await addRow(SH.cust, crow);
        DB.customers.push({ ...crow, _rowIndex: nextRowIndex(DB.customers, res) });
      } catch(e) {}
    }
    closeSheet(); toast(`已儲存 ${done} 個品項`);
    afterLocalChange();
  } catch(e) {
    if (done) afterLocalChange();
    btn.disabled = false; btn.textContent = '儲存訂單';
    if (done) { DRAFT.lines = DRAFT.lines.filter(L => !lines.slice(0, done).includes(L)); renderLines(); }
    toast((done ? `前 ${done} 個已存，` : '') + '儲存失敗：' + e.message);
  }
}

      <div class="kpi"><span>營業額</span><b class="num">${money(rev)}</b></div>
      <div class="kpi"><span>淨利</span><b class="num" style="color:var(--leaf)">${money(pro)}</b></div>
      <div class="kpi"><span>利潤率</span><b class="num">${rev ? (pro / rev * 100).toFixed(1) : 0}%</b></div>
      <div class="kpi"><span>茶葉／茶包</span><b class="num" style="font-size:16px">${+tea.toFixed(2)} 斤／${+bags.toFixed(0)}</b></div>
    </div>
    <div class="sec-t">品項排行（依金額）</div>
    <div class="list">${items.length ? items.map((x,i) => `
      <div class="rank"><span class="n">${i+1}</span>
        <div class="nm"><div>${esc(x.n)}${isBagName(x.n) ? '<span class="tag b">茶包</span>' : ''}</div>
          <small class="num">${+x.q.toFixed(3)} ${isBagName(x.n) ? '' : '斤'}　淨利 ${money(x.p)}${x.variants > 1 ? `　含 ${x.variants} 種寫法` : ''}</small>
          <div class="track"><i style="width:${x.t / imax * 100}%"></i></div></div>
        <span class="v num">${money(x.t)}</span></div>`).join('') : '<div class="empty">這段期間沒有訂單</div>'}</div>
    <div class="sec-t">客戶排行（前 10）</div>
    <div class="list">${custs.map(([n,t],i) => `
      <div class="rank"><span class="n">${i+1}</span><div class="nm"><div>${esc(n)}</div><div class="track"><i style="width:${t / cmax * 100}%"></i></div></div><span class="v num">${money(t)}</span></div>`).join('') || '<div class="empty">—</div>'}</div>
    <div class="sec-t">年度報表（Google Sheets）</div>
    <div id="annualBox"><div class="loading">讀取中…</div></div>`;
  loadAnnual();
}
async function loadAnnual() {
  try {
    if (!DB.annual.length) DB.annual = (await getAll(SH.annual)).filter(r => /^\d{4}/.test(String(r['年度'] || '')));
    const cols = ['總營業額','總利潤','總利潤率','年度茶葉銷量','年度茶包銷量','年度購買總斤數','購買總金額'];
    const fmt = (k, v) => k === '總利潤率' ? (num(v) <= 1 ? (num(v) * 100).toFixed(1) : num(v).toFixed(1)) + '%' : k.includes('金額') || k.includes('營業') || k.includes('利潤') ? money(v) : (+num(v).toFixed(2)).toLocaleString();
    const box = $('annualBox'); if (!box) return;
    box.innerHTML = DB.annual.length ? `<div class="tbl-w"><table><tr><th>年度</th>${cols.map(c => `<th>${c.replace('年度','').replace('總','')}</th>`).join('')}</tr>
      ${DB.annual.map(r => `<tr><td>${esc(String(r['年度']).slice(0,4))}</td>${cols.map(c => `<td class="num">${fmt(c, r[c])}</td>`).join('')}</tr>`).join('')}</table></div>` : '<div class="empty">年度報表是空的</div>';
  } catch(e) { const box = $('annualBox'); if (box) box.innerHTML = `<div class="err">年度報表讀取失敗：${esc(e.message)}</div>`; }
}

/* ================= 茶乾進貨 ================= */
let BUY_VIEW = [];
function renderPurchases() {
  const q = $('bq').value.trim().toLowerCase();
  let list = DB.purchases.map(r => ({ r, d: normDate(r['日期']) }));
  if (q) list = list.filter(x => (x.r['姓名'] + ' ' + x.r['品項'] + ' ' + (x.r['備註'] || '')).toLowerCase().includes(q));
  list.sort((a,b) => b.d.localeCompare(a.d) || b.r._rowIndex - a.r._rowIndex);
  BUY_VIEW = list;
  const y = String(new Date().getFullYear());
  const yl = DB.purchases.filter(r => normDate(r['日期']).startsWith(y));
  const yj = yl.reduce((a,r) => a + num(r['斤數']), 0), yt = yl.reduce((a,r) => a + (num(r['總價']) || num(r['斤數']) * num(r['價錢/斤'])), 0);
  $('bList').innerHTML = `
    <div class="kpis" style="margin-bottom:12px"><div class="kpi"><span>${y} 年進貨</span><b class="num">${(+yj.toFixed(2)).toLocaleString()} 斤</b></div><div class="kpi"><span>${y} 年金額</span><b class="num">${money(yt)}</b></div></div>
    ${list.length ? `<div class="list">${list.map((x,i) => `
      <button class="row" onclick="openPurchaseForm(${i})">
        <div class="m"><div class="t">${esc(x.r['品項'] || '（未填品項）')}</div><div class="s">${esc(x.r['姓名'])}　${esc(x.d.replace(/-/g,'/'))}　${num(x.r['斤數'])} 斤 × ${num(x.r['價錢/斤'])}</div></div>
        <div class="r"><b class="num">${money(num(x.r['總價']) || num(x.r['斤數']) * num(x.r['價錢/斤']))}</b></div>
      </button>`).join('')}</div>` : `<div class="empty">${DB.purchases.length ? '沒有符合的紀錄' : '還沒有進貨紀錄'}</div>`}`;
}
function openPurchaseForm(i) {
  const r = i !== undefined ? BUY_VIEW[i].r : null;
  const d = new Date(), defDate = `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
  openSheet(`
    <div class="sheet-h"><h2>${r ? '編輯進貨' : '新增進貨'}</h2><button onclick="closeSheet()">取消</button></div>
    <div class="sheet-b">
      <div class="grid2">
        <div class="fld"><label>供應商</label><input class="in" id="b_name" value="${esc(r ? r['姓名'] : '')}" placeholder="例：民"></div>
        <div class="fld"><label>日期</label><input class="in" id="b_date" value="${esc(r ? r['日期'] : defDate)}"></div>
      </div>
      <div class="fld"><label>品項</label><input class="in" id="b_item" value="${esc(r ? r['品項'] : '')}"></div>
      <div class="grid2">
        <div class="fld"><label>斤數</label><input class="in num" type="number" inputmode="decimal" id="b_jin" value="${r ? num(r['斤數']) : ''}" oninput="calcBuy()"></div>
        <div class="fld"><label>價錢/斤</label><input class="in num" type="number" inputmode="decimal" id="b_price" value="${r ? num(r['價錢/斤']) : ''}" oninput="calcBuy()"></div>
      </div>
      <div class="fld"><label>備註</label><input class="in" id="b_note" value="${esc(r ? r['備註'] : '')}"></div>
    </div>
    <div class="sheet-f"><div class="sum"><div><span>總價</span><b class="num" id="b_total">$0</b></div></div>
      <button class="btn gold" id="bSave" onclick="savePurchase(${r ? r._rowIndex : 0})">儲存進貨</button>
      ${r ? `<button class="btn danger" onclick="deletePurchase(${r._rowIndex})">刪除</button>` : ''}</div>`);
  calcBuy();
}
function calcBuy() { $('b_total').textContent = money(num($('b_jin').value) * num($('b_price').value)); }
async function savePurchase(rowIndex) {
  const data = { '姓名': $('b_name').value.trim(), '日期': $('b_date').value.trim(), '品項': $('b_item').value.trim(),
    '斤數': num($('b_jin').value), '價錢/斤': num($('b_price').value), '總價': num($('b_jin').value) * num($('b_price').value), '備註': $('b_note').value.trim() };
  if (!data['品項'] || !data['斤數']) { toast('請填品項與斤數'); return; }
  const b = $('bSave'); b.disabled = true; b.textContent = '儲存中…';
  try {
    if (rowIndex) { await updRow(SH.buy, rowIndex, data); Object.assign(DB.purchases.find(r => r._rowIndex === rowIndex) || {}, data); }
    else { const res = await addRow(SH.buy, data); DB.purchases.push({ ...data, _rowIndex: nextRowIndex(DB.purchases, res) }); }
    closeSheet(); toast('已儲存進貨');
    afterLocalChange();
  } catch(e) { b.disabled = false; b.textContent = '儲存進貨'; toast('儲存失敗：' + e.message); }
}
async function deletePurchase(rowIndex) {
  if (!confirm('刪除這筆進貨紀錄？')) return;
  try { await delRow(SH.buy, rowIndex); DB.purchases = shiftAfterDelete(DB.purchases, rowIndex); closeSheet(); toast('已刪除'); afterLocalChange(); }
  catch(e) { toast('刪除失敗：' + e.message); }
}

/* ================= 設定（存在這支手機） ================= */
function openSettings() {
  const f = (k, label) => `<div class="fld"><label>${label}</label><input class="in num" id="s_${k}" type="number" inputmode="decimal" value="${esc(SET[k])}"></div>`;
  const t = (k, label) => `<div class="fld"><label>${label}</label><input class="in" id="s_${k}" value="${esc(SET[k])}" inputmode="decimal"></div>`;
  openSheet(`
    <div class="sheet-h"><h2>設定</h2><button onclick="closeSheet()">關閉</button></div>
    <div class="sheet-b">
      <div class="box-t">每斤固定成本（一般茶自動帶入）</div>
      <div class="grid3">${f('leaf','茶葉消耗')}${f('roast','烘焙')}${f('deox','脫氧+鋁袋')}</div>
      <div class="box-t" style="margin-top:8px">快速按鈕（用逗號分隔）</div>
      ${t('boxChips','箱子')}${t('shipChips','運費')}${t('feeChips','手續費')}
      <div class="hint">設定只存在這支手機（或這台電腦）上，不會寫進 Google Sheets；改了只影響之後新增的訂單。</div>
      <button class="btn" onclick="saveSettings()">儲存設定</button>
      <button class="btn ghost" onclick="runDiag()">連線診斷</button>
      <div id="diagBox"></div>
      <button class="btn danger" onclick="if(confirm('登出並清除這支手機上的暫存資料？')){localStorage.removeItem('${CACHE_KEY}');requireLogin();location.reload()}">登出</button>
    </div>`);
}
async function runDiag() {
  const box = $('diagBox');
  const tests = [
    ['基本連線（小）', { action:'ping' }],
    ['茶乾購買（小）', { action:'getAll', sheet: SH.buy }],
    ['客戶資料（中）', { action:'getAll', sheet: SH.cust }],
    ['訂單紀錄（大）', { action:'getAll', sheet: SH.orders }],
    ['一次讀三張（最大）', { action:'bootstrap' }],
  ];
  const out = [];
  const show = () => box.innerHTML = `<div class="box" style="margin-top:10px">${out.join('')}</div>`;
  for (const [name, params] of tests) {
    out.push(`<div class="kv"><span>${name}</span><b>測試中…</b></div>`); show();
    const t0 = Date.now();
    try {
      const d = await apiOnce(params);
      const size = JSON.stringify(d).length;
      out[out.length - 1] = `<div class="kv"><span>${name}</span><b style="color:var(--leaf)">✓ ${((Date.now()-t0)/1000).toFixed(1)} 秒・${(size/1024).toFixed(0)} KB</b></div>`;
    } catch(e) {
      out[out.length - 1] = `<div class="kv"><span>${name}</span><b style="color:var(--red)">✗ ${((Date.now()-t0)/1000).toFixed(1)} 秒</b></div>
        <div class="hint" style="margin:2px 0 8px">${esc(e.message)}${e.status ? '<br>狀態碼 ' + e.status : ''}${e.raw ? '<br>' + esc(e.raw) : ''}</div>`;
    }
    show();
  }
  out.push(`<div class="hint" style="margin:8px 0 0">裝置：${esc(navigator.userAgent.replace(/.*?\(([^)]+)\).*/, '$1'))}</div>`); show();
}

function saveSettings() {
  ['leaf','roast','deox'].forEach(k => SET[k] = num($('s_' + k).value));
  ['boxChips','shipChips','feeChips'].forEach(k => SET[k] = chipList($('s_' + k).value).join(','));
  try { localStorage.setItem(SET_KEY, JSON.stringify(SET)); } catch(e) {}
  closeSheet(); toast('設定已儲存');
}

/* ================= 抽屜 ================= */
function openSheet(html) { $('sheet').innerHTML = html; $('sheetBg').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet() { $('sheetBg').classList.remove('open'); document.body.style.overflow = ''; EDIT = null; }

/* ================= 啟動 ================= */
(function init() {
  let saved = null;
  try { saved = localStorage.getItem('songfa_pwhash'); } catch(e) {}
  const t = loadCache();
  renderAll();
  if (t) setSync('ok', t);
  if (!saved) { $('login').classList.add('open'); return; }
  PW = saved;
  refreshAll();
})();
</script>
</body>
